# dot://<name>.dot/<path> — epoca's product scheme. Flags follow the
# moz-extension model (each host is its own scriptable, secure, web-exposed
# content origin) but grant no UI/extension load privileges and are not
# loadable by arbitrary web pages. URI_INHERITS_SECURITY_CONTEXT is
# deliberately absent: a product must never inherit its opener's principal.
# The matching NS_NewURI branch (src/netwerk/base/nsNetUtil-cpp.patch) makes
# dot URIs standard/host-bearing so the origin actually keys on the host.

Classes = [
    {
        'cid': '{d3e7f2cc-f5e9-4847-941d-87fc9e0b7866}',
        'contract_ids': ['@mozilla.org/network/protocol;1?name=dot'],
        'esModule': 'resource:///modules/EpocaDotAppProtocolHandler.sys.mjs',
        'constructor': 'EpocaDotAppProtocolHandler',
        'protocol_config': {
            'scheme': 'dot',
            'flags': [
                'URI_STD',
                'URI_IS_LOCAL_RESOURCE',
                'URI_IS_POTENTIALLY_TRUSTWORTHY',
                'URI_HAS_WEB_EXPOSED_ORIGIN',
                # A product (and chrome) can load its own resources; other
                # origins cannot even link to them.
                'URI_LOADABLE_BY_SUBSUMERS',
            ],
            'default_port': -1,
        },
    },
    {
        'cid': '{029a81b9-fa1c-4cad-9f0d-5fb9b05c9bd9}',
        'contract_ids': ['@mozilla.org/epoca/dotapp-content-policy;1'],
        'esModule': 'resource:///modules/EpocaDotAppContentPolicy.sys.mjs',
        'constructor': 'EpocaDotAppContentPolicy',
        'categories': {'content-policy': '@mozilla.org/epoca/dotapp-content-policy;1'},
    },
]
