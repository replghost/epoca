[DEFAULT]
support-files = [
  "head.js",
]
# In local (unpackaged) builds the epoca modules and actors are symlinked from
# dist into the source tree, which sits outside the build's srcdir. The content
# process sandbox cannot follow those symlinks, so any epoca code that must run
# in a content process (the dot:// protocol handler + content policy, the
# EpocaProduct/EpocaDotApp actors) fails to load and its loads hang. Packaged
# builds embed everything in omni.ja and are unaffected, so this only lowers the
# sandbox for these dev-build tests. See EpocaUserAgent.sys.mjs.
prefs = [
  "security.sandbox.content.level=0",
]

["browser_epoca_accounts.js"]

["browser_epoca_bridge.js"]

# Network test: talks to the live Paseo Asset Hub next RPC. Guards the chain
# transport products use to load the on-chain app registry.
["browser_epoca_chain.js"]

["browser_epoca_dotapp.js"]

["browser_epoca_dotns.js"]

["browser_epoca_ss58.js"]

["browser_epoca_storage.js"]

