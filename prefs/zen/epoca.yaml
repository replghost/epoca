# Master switch for epoca's user-agent (product hosting) functionality.
# Off by default while the bridge is a proof of concept.
- name: epoca.useragent.enabled
  value: false

# Skip account/signing consent prompts and approve automatically. For
# automated testing and kiosk/dev use only — leaving this on defeats the
# host's signing consent guarantees.
- name: epoca.useragent.auto-approve
  value: false

# Override the wallet mnemonic (BIP-39) instead of generating one per
# profile. Empty means "generate and persist". For tests and dev only.
- name: epoca.useragent.dev-mnemonic
  value: ""

# JSON object mapping dotapp product ids to local directories holding an
# unpacked bundle, e.g. {"browse": "/path/to/browse/dist"}. Lets a product
# load at dotapp://<id>/ before dotNS/CAR distribution exists. Dev only.
- name: epoca.dotapp.dev-roots
  value: ""

# Resolve unknown dotapp products through dotNS (on-chain contenthash
# lookup + IPFS bundle fetch) on first navigation. The fetch is performed
# by the host in the parent process; products themselves stay network-locked.
- name: epoca.dotapp.dotns.enabled
  value: true
