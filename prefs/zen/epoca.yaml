# Master switch for epoca's user-agent (product hosting) functionality.
# Off by default while the bridge is a proof of concept.
- name: epoca.useragent.enabled
  value: false

# Skip account/signing consent prompts and approve automatically. For
# automated testing and kiosk/dev use only — leaving this on defeats the
# host's signing consent guarantees.
- name: epoca.useragent.auto-approve
  value: false

# Override the wallet mnemonic (BIP-39) instead of generating one per
# profile. Empty means "generate and persist". For tests and dev only.
- name: epoca.useragent.dev-mnemonic
  value: ""

# JSON object mapping dotapp product ids to local directories holding an
# unpacked bundle, e.g. {"browse": "/path/to/browse/dist"}. Lets a product
# load at dotapp://<id>/ before dotNS/CAR distribution exists. Dev only.
- name: epoca.dotapp.dev-roots
  value: ""

# Resolve unknown dotapp products through dotNS (on-chain contenthash
# lookup + IPFS bundle fetch) on first navigation. The fetch is performed
# by the host in the parent process; products themselves stay network-locked.
- name: epoca.dotapp.dotns.enabled
  value: true

# Chains the host connects to on behalf of products, as a JSON object of
# genesis hash -> list of JSON-RPC WebSocket endpoints. Default: Asset Hub
# Paseo (next/v2), where dotNS and the browse registry live.
- name: epoca.chain.networks
  value: '{"0xbf0488dbe9daa1de1c08c5f743e26fdc2a4ecd74cf87dd1b4b1eeb99ae4ef19f": ["wss://paseo-asset-hub-next-rpc.polkadot.io"]}'

# IPFS gateway origins products may load images from (app icons reference
# bare CIDs on the Bulletin gateway). The one deliberate exception to the
# product no-network rule; applies to image loads only.
- name: epoca.dotapp.image-gateways
  value: '["https://paseo-bulletin-next-ipfs.polkadot.io"]'

# Bulletin IPFS gateway the host fetches preimage-lookup bodies from
# (content-addressed product data: icons, receipts, ...). The fetch runs in
# the parent process on the product's behalf; the product stays network-locked.
- name: epoca.dotapp.preimage-gateway
  value: "https://paseo-bulletin-next-ipfs.polkadot.io"

# Allow DOM localStorage for dot:// product origins. Without this, LSNG
# rejects the datastore request (dot:// windows aren't registered as storage
# clients) and window.localStorage throws, crashing unmodified web/framework
# apps (e.g. Next.js products) that touch it during hydration. Products are
# still origin-isolated; durable app state is expected to go over the TrUAPI
# storage host functions. TRADEOFF: this disables the LSNG client-id check
# globally (not just for dot://), a modest defense-in-depth reduction against
# a compromised content process forging a storage principal. Proper fix:
# register a ClientSource for dot:// documents so validation passes per-origin.
- name: dom.storage.client_validation
  value: false
